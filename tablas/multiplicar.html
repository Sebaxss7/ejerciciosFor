<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Multiplicar</title>
  <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

  <!-- Sección superior con la caja de texto y el botón -->
  <div class="top">
    <input type="number" id="txtNumero" placeholder="¿Qué tabla?" class="input-tabla">
    <button class="btn" onclick="generarTablas()">PROBAR</button>
  </div>

  <!-- Contenedor principal de la tabla -->
  <div class="tabla" id="divTabla">
    <h2>Tabla de Multiplicar</h2>
    
    <div class="tabla-grid">
      <div class="fila">¡Escribe un número arriba!</div>
    </div>
  </div>

  <!-- Archivo JavaScript -->
  <script src="multiplicar.js" defer></script>
</body>
</html>
