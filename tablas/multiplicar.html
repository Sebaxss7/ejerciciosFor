<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Multiplicar</title>
  <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

  <!-- Sección superior con la caja de texto y el botón -->
  <div class="top">
    <h2>¡Aprende las Tablas jugando! 🚀</h2>
    <p class="instruccion">Escribe el número de la tabla que quieres practicar:</p>
    
    <div class="controles">
      <input type="number" id="txtNumero" placeholder="Ej: 5" class="input-tabla">
      <button class="btn" onclick="generarTablas()">PROBAR</button>
    </div>
  </div>

 <div class="tabla" id="divTabla">
    <h2>¡Elige una tabla arriba para empezar! ✨</h2>
    
    <div class="tabla-grid">
      <div class="fila">Aquí aparecerá tu tabla</div>
    </div>
  </div>

  <script src="multiplicar.js" defer></script>
</body>
</html>
